name: Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and exercise MSI
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Enable long paths
        run: git config --global core.longpaths true

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Link MSI definition
        shell: pwsh
        run: |
          $smokeDirectory = Join-Path $env:RUNNER_TEMP "strek-wix-smoke"
          $wixObject = Join-Path $smokeDirectory "main.wixobj"
          $smokeInstaller = Join-Path $smokeDirectory "strek-smoke.msi"
          $placeholderExecutable = Join-Path $smokeDirectory "strek.exe"
          New-Item -ItemType Directory -Force $smokeDirectory | Out-Null
          Copy-Item "$env:WINDIR\System32\where.exe" $placeholderExecutable

          & candle.exe -nologo -arch x64 -ext WixUtilExtension `
            -dTargetVendor=pc `
            "-dVersion=0.1.0" `
            -dPlatform=x64 `
            -dProfile=dist `
            -dTargetEnv=msvc `
            -dTargetTriple=x86_64-pc-windows-msvc `
            -dCargoProfile=dist `
            "-dCargoTargetDir=$PWD\target" `
            "-dCargoTargetBinDir=$smokeDirectory" `
            -out $wixObject `
            apps/gpui/wix/main.wxs
          if ($LASTEXITCODE -ne 0) {
            throw "WiX compiler failed with exit code $LASTEXITCODE"
          }

          & light.exe -nologo -spdb `
            -ext WixUIExtension `
            -ext WixUtilExtension `
            -cultures:en-us `
            -out $smokeInstaller `
            -b apps/gpui `
            $wixObject
          if ($LASTEXITCODE -ne 0) {
            throw "WiX linker failed with exit code $LASTEXITCODE"
          }

          & .github/scripts/test-windows-msi.ps1 `
            -MsiPath $smokeInstaller `
            -InstallDirectory (Join-Path $env:RUNNER_TEMP "Strek Smoke Install") `
            -InstallLog (Join-Path $env:RUNNER_TEMP "strek-msi-smoke-install.log") `
            -UninstallLog (Join-Path $env:RUNNER_TEMP "strek-msi-smoke-uninstall.log")

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: windows-msi
          cache-on-failure: "true"

      - name: Install dist
        shell: bash
        run: .github/scripts/install-cargo-dist.sh

      - name: Build MSI
        run: dist build --artifacts=local --target=x86_64-pc-windows-msvc --output-format=json > dist-manifest.json

      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: windows-msi
          if-no-files-found: error
          path: |
            target/distrib/*.msi
            target/distrib/*.msi.sha256

      - name: Verify checksum and custom-path install
        shell: pwsh
        run: |
          $msiFiles = @(Get-ChildItem target/distrib/*.msi)
          if ($msiFiles.Count -ne 1) {
            throw "Expected exactly one MSI, found $($msiFiles.Count)"
          }

          $msi = $msiFiles[0]
          $checksumFile = "$($msi.FullName).sha256"
          $expectedChecksum = ((Get-Content $checksumFile -Raw).Trim() -split '\s+')[0]
          $actualChecksum = (Get-FileHash $msi.FullName -Algorithm SHA256).Hash
          if ($actualChecksum -ne $expectedChecksum) {
            throw "MSI checksum mismatch: expected $expectedChecksum, got $actualChecksum"
          }

          & .github/scripts/test-windows-msi.ps1 `
            -MsiPath $msi.FullName `
            -InstallDirectory (Join-Path $env:RUNNER_TEMP "Strek Custom Install") `
            -InstallLog (Join-Path $env:RUNNER_TEMP "strek-msi-install.log") `
            -UninstallLog (Join-Path $env:RUNNER_TEMP "strek-msi-uninstall.log")

      - name: Upload installer diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: windows-msi-diagnostics
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/strek-msi-*.log
