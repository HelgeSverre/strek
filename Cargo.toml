[workspace]
members = [
    "crates/editor_core",
    "crates/editor_render",
    "crates/render_svg",
    "apps/gpui",
]
resolver = "2"

[workspace.dependencies]
glam = { version = "0.29", features = ["serde"] }
slotmap = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-segmentation = "1.12"
