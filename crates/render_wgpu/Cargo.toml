[package]
name = "render_wgpu"
version = "0.1.0"
edition = "2021"
description = "wgpu-based renderer for the vector editor"

[dependencies]
editor_render = { path = "../editor_render" }
ui = { path = "../ui" }
glam = { workspace = true }
wgpu = "23.0"
winit = "0.30"
lyon = "1.0"
bytemuck = { version = "1.14", features = ["derive"] }
fontdue = "0.9"
log = "0.4"
