[package]
name = "vector-editor-web"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
editor_core = { path = "../../crates/editor_core" }
render_svg = { path = "../../crates/render_svg" }
glam = { workspace = true }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
    "Document",
    "Element",
    "HtmlElement",
    "Node",
    "Window",
    "MouseEvent",
    "KeyboardEvent",
    "WheelEvent",
    "PointerEvent",
    "SvgsvgElement",
    "SvgElement",
    "DomRect",
    "CssStyleDeclaration",
]

[dev-dependencies]
wasm-bindgen-test = "0.3"
