<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 13px;
        }

        #app {
            width: 100%;
            height: 100%;
            display: flex;
        }

        #canvas-container {
            flex: 1;
            height: 100%;
            background: #f5f5f5;
            position: relative;
        }

        #canvas-container svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        #layers-panel {
            width: 240px;
            height: 100%;
            background: #2a2a2a;
            color: #e0e0e0;
            border-left: 1px solid #1a1a1a;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        #layers-header {
            padding: 12px 16px;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #888;
            border-bottom: 1px solid #1a1a1a;
        }

        #layers-list {
            flex: 1;
            overflow-y: auto;
        }

        .layer-entry {
            display: flex;
            align-items: center;
            padding: 6px 8px;
            cursor: pointer;
            border-bottom: 1px solid #222;
        }

        .layer-entry:hover {
            background: #333;
        }

        .layer-entry.selected {
            background: #0066cc;
        }

        .layer-expand {
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 4px;
            color: #888;
            font-size: 10px;
        }

        .layer-expand.has-children {
            cursor: pointer;
        }

        .layer-expand.has-children:hover {
            color: #fff;
        }

        .layer-icon {
            width: 16px;
            height: 16px;
            margin-right: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
        }

        .layer-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .layer-visibility {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #666;
            border-radius: 3px;
        }

        .layer-visibility:hover {
            background: #444;
            color: #fff;
        }

        .layer-visibility.hidden {
            color: #444;
        }

        .layer-entry.invisible {
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="canvas-container">
            <!-- SVG will be inserted here -->
        </div>
        <div id="layers-panel">
            <div id="layers-header">Layers</div>
            <div id="layers-list">
                <!-- Layer entries will be inserted here -->
            </div>
        </div>
    </div>

    <script type="module">
        import init from './pkg/vector_editor_web.js';

        async function run() {
            await init();
            console.log('Vector Editor loaded');
        }

        run().catch(console.error);
    </script>
</body>
</html>
