[package]
name = "strek-legacy"
version = "0.1.0"
edition = "2021"
description = "Legacy wgpu desktop application for Strek"

[[bin]]
name = "strek-legacy"
path = "src/main.rs"

[dependencies]
editor_core = { path = "../../crates/editor_core" }
render_wgpu = { path = "../../crates/render_wgpu" }
ui = { path = "../../crates/ui" }
glam = { workspace = true }
winit = "0.30"
wgpu = "23.0"
pollster = "0.4"
log = "0.4"
env_logger = "0.11"
