[package]
name = "strek"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A native vector editor for logos and icons"
authors = ["Helge Sverre <helge.sverre@gmail.com>"]
repository = "https://github.com/HelgeSverre/strek"
homepage = "https://github.com/HelgeSverre/strek"
readme = "../../README.md"

[dependencies]
base64 = "0.22"
editor_core = { path = "../../crates/editor_core" }
editor_render = { path = "../../crates/editor_render" }
render_svg = { path = "../../crates/render_svg" }
glam = { workspace = true }
gpui = { git = "https://github.com/zed-industries/zed", rev = "v0.179.4" }
log = "0.4"
env_logger = "0.11"
image = "0.25"
lyon = "1.0"
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
rmcp = { version = "3.0.1", features = ["transport-io"] }
schemars = "1"
serde = { workspace = true }
serde_json = { workspace = true }
smallvec = "1"
tokio = { version = "1", features = ["io-std", "rt", "sync"] }
unicode-segmentation = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "strek"
path = "src/main.rs"

[package.metadata.packager]
before-packaging-command = "cargo build --release --locked -p strek"
product-name = "Strek"
identifier = "no.helgesverre.strek"
icons = ["assets/app-icon.icns"]
resources = [{ src = "assets/Strek Automation.applescript", target = "Contents/Resources/Strek Automation.applescript" }]
license-file = "../../LICENSE"
formats = ["app"]

[package.metadata.packager.macos]
signing-identity = "-"
