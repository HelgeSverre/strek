[package]
name = "strek"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Native vector editor for logos and icons"
authors = ["Helge Sverre <helge.sverre@gmail.com>"]
repository = "https://github.com/HelgeSverre/strek"
homepage = "https://github.com/HelgeSverre/strek"
readme = "../../README.md"

[dependencies]
base64 = "0.22"
directories = "6"
editor_core = { path = "../../crates/editor_core" }
editor_render = { path = "../../crates/editor_render" }
render_svg = { path = "../../crates/render_svg" }
glam = { workspace = true }
gpui = { git = "https://github.com/zed-industries/zed", rev = "v0.179.4" }
log = "0.4"
env_logger = "0.11"
image = "0.25"
lyon = "1.0"
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
rmcp = { version = "3.0.1", features = ["transport-io"] }
roxmltree = "0.20"
schemars = "1"
serde = { workspace = true }
serde_json = { workspace = true }
simplecss = "0.2.2"
smallvec = "1"
tokio = { version = "1", features = ["io-std", "rt", "sync"] }
unicode-segmentation = { workspace = true }
url = "2.5"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "v0.179.4", features = ["test-support"] }

[[bin]]
name = "strek"
path = "src/main.rs"

[package.metadata.packager]
before-packaging-command = "cargo build --release --locked -p strek"
product-name = "Strek"
identifier = "no.helgesverre.strek"
icons = ["assets/app-icon.icns"]
resources = [{ src = "assets/AUTOMATION.applescript", target = "AUTOMATION.applescript" }]
license-file = "../../LICENSE"
formats = ["app"]

[package.metadata.packager.macos]
minimum-system-version = "12.3"
signing-identity = "-"

[package.metadata.wix]
upgrade-guid = "B3DB2893-3377-416B-9AC8-216808A18204"
path-guid = "6B0BBEB8-8A4D-471F-AE5C-0736EA1DB81E"
license = false
eula = false
